name: CI and Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check release version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Require release tag to match Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          metadata = json.loads(subprocess.check_output([
              'cargo', 'metadata', '--locked', '--no-deps', '--format-version', '1'
          ]))
          version = metadata['packages'][0]['version']
          expected = f'v{version}'
          actual = os.environ['GITHUB_REF_NAME']
          if actual != expected:
              raise SystemExit(f'Tag {actual!r} must match Cargo.toml version: {expected}')
          PY

  build:
    name: Build ${{ matrix.platform }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
    defaults:
      run:
        shell: bash
    env:
      BUILD_TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install musl compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          echo 'CC=musl-gcc' >> "$GITHUB_ENV"
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --target "$BUILD_TARGET"
          rustup default stable
      - name: Check formatting
        run: cargo fmt --check
      - name: Run unit tests
        run: cargo test --locked --target "$BUILD_TARGET"
      - name: Build release binary
        run: cargo build --release --locked --target "$BUILD_TARGET"
      - name: Check executable and process lifecycle
        env:
          MSET_BINARY: target/${{ matrix.target }}/release/mset
        run: |
          "$MSET_BINARY" --version
          python3 tests/lifecycle.py
      - name: Package binary and documentation
        run: |
          version=$(python3 -c 'import json, subprocess; print(json.loads(subprocess.check_output(["cargo", "metadata", "--locked", "--no-deps", "--format-version", "1"]))["packages"][0]["version"])')
          archive="mset-v${version}-${PLATFORM}"
          mkdir -p "dist/$archive"
          cp "target/$BUILD_TARGET/release/mset" README.md "dist/$archive/"
          mkdir -p "dist/$archive/docs"
          cp docs/README.zh-CN.md "dist/$archive/docs/"
          tar -czf "dist/$archive.tar.gz" -C dist "$archive"
          rm -r "dist/$archive"
      - uses: actions/upload-artifact@v6
        with:
          name: mset-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: mset-*
          merge-multiple: true
          path: dist
      - name: Generate SHA256 checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$RELEASE_TAG" == *-* ]]; then
              gh release create "$RELEASE_TAG" --verify-tag --generate-notes --prerelease
            else
              gh release create "$RELEASE_TAG" --verify-tag --generate-notes
            fi
          fi
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
