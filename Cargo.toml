[package]
name = "mihomo_set"
version = "0.1.1"
edition = "2024"

[[bin]]
name = "mset"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "3"
serde_json = "1"
unicode-width = "0.2"
ureq = { version = "2", features = ["json"] }
urlencoding = "2"
flate2 = "1"
serde_yaml_ng = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
